name: RemoteTargetiPhoneDaemon
options:
  bundleIdPrefix: com.soni08.remotetarget
targets:
  RemoteTargetiPhoneDaemon:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.soni08.remotetarget.RemoteTargetiPhoneDaemon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: RemoteTargetiPhoneDaemon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: "fetch remote-notification"
